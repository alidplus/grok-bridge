<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{csp}} https: data:; style-src {{csp}}; script-src 'nonce-{{nonce}}';">
<link rel="stylesheet" href="{{style}}">
</head>
<body>
<header class="bar">
  <button id="back" class="icon" title="Back to chat" aria-label="Back to chat" hidden>
    <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg></button>
  <div id="title" class="title">New Agent</div>
  <span id="liveDot" class="live-dot" title="Running" hidden></span>
  <button id="new" class="icon" title="New agent" aria-label="New agent">
    <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg></button>
  <button id="history" class="icon" title="History" aria-label="History">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" /><path d="M8 5v3.2l2 1.3" /></svg></button>
</header>

<main id="chat" class="view">
  <div id="conv" class="conv"></div>
  <div id="empty" class="empty">
    <div class="empty-title">Start a Cursor agent</div>
    <p>It works in <code id="emptyCwd">this folder</code> with full file and terminal access.</p>
    <p class="muted">Grok Bots can drive agents too, over MCP. Their runs show up here live.</p>
  </div>
</main>

<main id="historyView" class="view" hidden>
  <label class="field">
    <span>Folder</span>
    <input id="cwd" spellcheck="false" title="Agents are listed per folder. Press Enter to reload.">
  </label>
  <div id="list" class="list"></div>
  <footer class="mcp" id="mcp"></footer>
</main>

<div id="notice" class="notice" hidden></div>
<div id="sr" class="sr-only" role="status" aria-live="polite"></div>

<form id="composer" class="composer">
  <textarea id="prompt" rows="1" placeholder="Ask the agent to build, fix or explain…" aria-label="Prompt"></textarea>
  <div class="composer-row">
    <label class="pill" title="Model for the next message">
      <select id="model" aria-label="Model"></select>
      <svg viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" /></svg>
    </label>
    <span id="hint" class="hint"></span>
    <button id="send" class="send" type="submit" title="Send (Enter)" aria-label="Send" disabled>
      <svg class="i-send" viewBox="0 0 16 16"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2" /></svg>
      <svg class="i-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2" /></svg>
    </button>
  </div>
</form>
<script nonce="{{nonce}}" src="{{script}}"></script>
</body></html>
